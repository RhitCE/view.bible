<script>
const themeBtn = document.getElementById("theme");
themeBtn.textContent = document.documentElement.dataset.theme === "dark" ? "Light" : "Dark";
themeBtn.onclick = () => { const m = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = m; themeBtn.textContent = m === "dark" ? "Light" : "Dark"; try { localStorage.setItem("vb-theme", m); } catch (e) {} };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", q => { let t = null; try { t = localStorage.getItem("vb-theme"); } catch (e) {}
  if (!t) { document.documentElement.dataset.theme = q.matches ? "dark" : "light"; themeBtn.textContent = q.matches ? "Light" : "Dark"; } });

// The box to find a person (decision D065's box, from the timeline): every person the Bible Inventory's cards hold, from
// names.js; the years of those on the timeline's band, from band.js. Both are fetched the first time the box is used.
const box = document.getElementById("find"), list = document.getElementById("list"), sc = document.getElementById("sc"), ct = document.getElementById("ct");
let NAMES = null, PEOPLE = null, wait = null, hits = [], gold = -1;
window.VBNAMES = d => { NAMES = d; };
const load = src => new Promise(res => { const s = document.createElement("script"); s.src = src; s.onload = s.onerror = () => res(); document.head.appendChild(s); });
function need() { return wait || (wait = Promise.all([load("names.js"), load("band.js")])); }
// capitals and marks ignored; a hyphen counts as a space, so 'Edom' finds Obed-Edom (as on the timeline)
const fold = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[‘’'`]/g, "").replace(/[\s\-‐-―]+/g, " ").trim();
const esc = s => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function people() {
  if (PEOPLE) return PEOPLE;
  const rows = new Map(((window.BAND || {}).rows || []).map(r => [r.i, r]));
  PEOPLE = ((NAMES || {}).people || []).map(([id, n, d, vc, alts = [], same = []]) => ({ id, n, d, vc, alts, same, keys: [fold(n), ...alts.map(fold)] }));
  const byId = new Map(PEOPLE.map(p => [p.id, p]));
  // the band row a person is drawn on: their own, or that of an entry the Inventory holds to be the same person
  PEOPLE.forEach(p => { if (rows.has(p.id)) { p.row = rows.get(p.id); return; }
    const seen = new Set([p.id]), st = [...p.same];
    while (st.length) { const q = st.shift(); if (seen.has(q)) continue; seen.add(q); if (rows.has(q)) { p.row = rows.get(q); return; } st.push(...((byId.get(q) || {}).same || [])); } });
  return PEOPLE;
}
// 0 the name itself, 1 it begins the name, 2 it begins a later word of it
const fit = (k, q) => k === q ? 0 : k.startsWith(q) ? 1 : (" " + k).includes(" " + q) ? 2 : 9;
function search(raw) {
  const q = fold(raw); if (!q) return [];
  const out = [];
  people().forEach(p => { let best = 9; p.keys.forEach(k => { best = Math.min(best, fit(k, q)); }); if (best < 9) out.push({ p, t: best }); });
  return out.sort((a, b) => a.t - b.t || b.p.vc - a.p.vc || (a.p.id < b.p.id ? -1 : 1));
}
function show() {
  const raw = box.value; if (!fold(raw)) { hide(); return; }
  hits = search(raw); gold = -1;
  sc.innerHTML = hits.length ? hits.map((h, i) => { const p = h.p, id = encodeURIComponent(p.id);
      const map = p.row ? `<a class="go" href="bible-map/index.html#y=${p.row.a}"><span class="arr" aria-hidden="true">→</span>On the Map, in those years</a>`
        : `<span class="go off"><span class="arr" aria-hidden="true">→</span>No years given for the map</span>`;
      return `<div class="row" role="option" id="r${i}"><div class="who"><div class="n">${esc(p.n)}${p.alts.length ? `<i>also ${esc(p.alts.join(", "))}</i>` : ""}</div>${p.d ? `<div class="d">${esc(p.d)}</div>` : ""}</div>`
        + `<a class="go first" href="bible-timeline/index.html#${id}"><span class="arr" aria-hidden="true">→</span>On the Timeline</a>${map}</div>`; }).join("")
    : `<div class="none">No one of that name in the Bible Inventory, which does not yet reach every book.</div>`;
  ct.textContent = hits.length === 1 ? "1 person" : `${hits.length.toLocaleString()} people`; ct.style.display = hits.length ? "" : "none";
  list.classList.add("on"); sc.scrollTop = 0; box.setAttribute("aria-expanded", "true"); box.removeAttribute("aria-activedescendant");
}
function hide() { list.classList.remove("on"); box.setAttribute("aria-expanded", "false"); gold = -1; }
function goldTo(i) {
  const rows = sc.querySelectorAll(".row"); if (!rows.length) return;
  if (gold >= 0 && rows[gold]) rows[gold].classList.remove("hi");
  gold = Math.max(0, Math.min(rows.length - 1, i)); rows[gold].classList.add("hi"); rows[gold].scrollIntoView({ block: "nearest" });
  box.setAttribute("aria-activedescendant", "r" + gold);
}
box.addEventListener("focus", () => need().then(() => { if (document.activeElement === box && fold(box.value)) show(); }));
box.addEventListener("input", () => need().then(show));
box.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!list.classList.contains("on")) { if (fold(box.value)) need().then(show); return; }
    goldTo(gold < 0 ? (e.key === "ArrowDown" ? 0 : hits.length - 1) : gold + (e.key === "ArrowDown" ? 1 : -1)); }
  else if (e.key === "Enter") { e.preventDefault(); need().then(() => { if (!list.classList.contains("on")) show(); const r = sc.querySelectorAll(".row")[Math.max(0, gold)];
    const a = r && r.querySelector("a.go.first"); if (a) location.href = a.href; }); }
  else if (e.key === "Escape") { e.preventDefault(); hide(); }
});
document.addEventListener("pointerdown", e => { if (!e.target.closest(".wrap")) hide(); }, true);
document.body.dataset.ready = "1";
</script>
<script>/* the visit counter, as on every page (the owner, 09/30/2026 and 10/03/2026; pages.py COUNT_JS) */
(function () { const A = "https://abacus.jasoncameron.dev/", N = "view.bible/";
  let me = false;
  try { const q = location.search;
    if (/[?&]not-counted\b/.test(q)) { localStorage.setItem("vb-not-counted", "1"); alert("Visits from this browser will not be counted."); }
    if (/[?&]counted\b/.test(q)) { localStorage.removeItem("vb-not-counted"); alert("Visits from this browser will be counted again."); }
    if (/counted\b/.test(q)) history.replaceState(null, "", location.pathname + location.hash);
    me = localStorage.getItem("vb-not-counted") === "1"; } catch (e) {}
  const robot = navigator.webdriver || /bot|crawl|spider|slurp|headless|lighthouse|preview|inspectiontool|googleother/i.test(navigator.userAgent);
  const live = location.host === "view.bible" && !me && !robot;
  if (live) { const tally = ev => { if (ev.type === "auxclick" && ev.button !== 1) return;
      const a = ev.target && ev.target.closest && ev.target.closest("a[download]"); if (!a) return;
      const f = (a.getAttribute("href") || "").split(/[?#]/)[0].split("/").pop().replace(/[^A-Za-z0-9_.-]/g, "");
      if (f) fetch(A + "hit/" + N + ("dl-" + f).slice(0, 64), { keepalive: true }).catch(() => {}); };
    addEventListener("click", tally); addEventListener("auxclick", tally); }
  const el = document.getElementById("hits"); if (!el) return;
  const nav = ((performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || {}).type;
  let outside = true; try { outside = !document.referrer || new URL(document.referrer).host !== location.host; } catch (e) {}
  const hit = live && outside && nav !== "reload" && nav !== "back_forward";
  if (hit) try { if (!localStorage.getItem("vb-seen")) { localStorage.setItem("vb-seen", new Date().toISOString().slice(0, 10));
    fetch(A + "hit/" + N + "browsers").catch(() => {}); } } catch (e) {}
  fetch(A + (hit ? "hit/" : "get/") + N + "visits")
    .then(r => r.ok ? r.json() : null).then(j => { if (j && j.value > 0) el.textContent = j.value.toLocaleString("en-US"); }).catch(() => {});
})();</script>
