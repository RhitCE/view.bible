/* The colours of Study 4 (Colour Research.pdf, chosen by the owner 09/28/2026): palette "Grapher", after Our World in Data,

:root {

// Events and Maps and Charts. Each item's words stand on the highest level free of the words to its left, below every level
// still running at its place, so no stem crosses words. Where no level is free, the item joins the group before it and the
// group shares one stem, its words stacked up the stem: full blocks where they fit, slim ones where they do not (the user,
// 09/27/2026). Items come sorted by x, each {x, w}; the result is groups of items, each with its level (lv) and slim flag,
// or lv null when even alone it cannot be shown.
function stackPlace(items, levels, blockH, slimH) {
  let units = items.map(it => [it]);

    const ends = Array(levels).fill(-1e9); let bad = -1;

      let occ = -1; for (let l = 0; l < levels; l++) if (ends[l] + 14 > x) occ = l;
      const lv = occ + 1; u.slim = k > 1 && lv + k > levels; const need = u.slim ? Math.ceil(k * slimH / blockH) : k;
      if (lv + need > levels) { bad = i; break; }
      u.lv = lv; for (let l = lv; l < lv + need; l++) ends[l] = x + wd;
    }
    if (bad < 0) return units;
    if (bad === 0) { units[0].lv = null; return [units[0], ...stackPlace(units.slice(1).flat(), levels, blockH, slimH)]; }
    units.splice(bad - 1, 2, units[bad - 1].concat(units[bad]));

  if (o.kind === "Graphic") h = `${o.img ? `<img src="${o.img}"${o.page ? ` alt="${o.name}, ${o.sub.toLowerCase()}"` : ""}>` : ""}<div class="body"><div class="kind">${o.pdf ? "Map or chart · free" : o.open || o.status}</div><h3>${o.name}</h3><div class="when num">${o.ref} · ${when(o)}</div>
    <p>${o.pdf ? (o.sheet || "One printable sheet, 17 × 11 inches.") + " Its own page carries the full-size view, the notes and the sources." : o.open ? o.sheet : "This sheet is " + o.status.toLowerCase() + ". It will take its place over these years when it is finished."}</p>
    ${o.pdf ? `<div class="acts"><a class="btn1" href="${o.pdf}" download>Download PDF · ${o.size}</a>${o.page ? `<a class="btn2" href="${o.page}">Open the page</a>` : ""}</div>` : o.open && o.page ? `<div class="acts"><a class="btn1" href="${o.page}">Open the map</a></div>` : ""}</div>`;
  else if (o.inv && CARDS[o.inv]) { h = invCard(o.inv, o.kind === "Person" ? "Descendants of Adam" : "Events", o); }
  else if (o.kind === "Person") { const sons = PEOPLE.filter(p => p.parent === o.i).map(p => p.name);
    h = `<div class="body"><div class="kind">Descendants of Adam</div><h3>${o.name}</h3><div class="when num">${when(o)}</div>
    <dl><dt>Lived</dt><dd class="num">${o.d - o.b} years</dd><dt>World years</dt><dd class="num">${amS(o.b)} – ${amS(o.d)}</dd><dt>Father</dt><dd>${o.parent >= 0 ? PEOPLE[o.parent].name : "—"}</dd><dt>Son</dt><dd>${sons.join(", ") || "—"}</dd><dt>Scripture</dt><dd>${o.ref}</dd></dl>
    <p>${o.approx ? "Placed approximately; Scripture does not give every year of this life." : "Every year here is arithmetic from the ages Scripture gives."}</p>
    <div class="acts"><a class="btn2" href="#" onclick="openPanel('d0');return false">See it on From Adam to Moses</a></div></div>`; }
  else if (o.kind === "Event") h = `<div class="body"><div class="kind">Events</div><h3>${o.name}</h3><div class="when num">${when(o)}</div>${o.sum ? `<p>${o.sum}.</p>` : ""}<dl><dt>Scripture</dt><dd>${o.ref}</dd><dt>World years</dt><dd class="num">${o.e == null ? amS(o.s) : amS(o.s) + " – " + amS(o.e)}</dd></dl><div class="fine">Placeholder dates and text.</div></div>`;
  else h = `<div class="body"><div class="kind">Books of the Bible · ${o.sec}</div><h3>${o.name}</h3><div class="when num">Written ${when(o)}</div><dl><dt>Writer</dt><dd>${o.author}</dd><dt>World years</dt><dd class="num">${amS(o.s)} – ${amS(o.e)}</dd></dl><div class="fine">Placeholder dates.</div></div>`;
  pbody.innerHTML = h; finishCard(); }
function closePanel() { panel.classList.remove("open"); }

/* ---------- a card written from the Bible Inventory: every line approved against the NKJV, with its verses ---------- */
// Everything that names an entry is a link to that entry's own card, so the facts lead from one to the next (09/28/2026).
// The Inventory's cards come in files of 200 entries (inv\per0.js holds PER-00000 to PER-00199), each fetched the first time
// one of its cards is wanted, so the page stays small however large the Inventory grows (09/28/2026).
const CARDS = {}, LOADING = {}, LOADED = {};
window.VBI = group => Object.assign(CARDS, group);
const chunkOf = id => id.slice(0, 3).toLowerCase() + Math.floor(+id.slice(4) / ((INV && INV.chunk) || 200));
function needCard(id) { if (CARDS[id]) return Promise.resolve(); const k = chunkOf(id);
  return LOADING[k] || (LOADING[k] = new Promise(res => { const s = document.createElement("script"); s.src = "inv/" + k + ".js";
    s.onload = s.onerror = () => { LOADED[k] = true; res(); }; document.head.appendChild(s); })); }
const waiting = id => INV && !CARDS[id] && !LOADED[chunkOf(id)];
function afterLoad(id, then) { const nav = cardNav, back = cardBack; needCard(id).then(() => { cardNav = nav; cardBack = back; then(); cardNav = false; }); }
let NM = {};  // the names the card being written links to
const LABEL = { "name": "Names", "father": "Father", "mother": "Mother", "spouse": "Married", "concubine": "Concubine", "sibling": "Brother or sister",
  "lifespan": "Lived", "meaning of name": "Name means", "reason for name": "Why the name", "lived at": "Lived at", "burial place": "Buried",
  "occupation": "Work", "place": "Where", "participant": "Who", "part of": "Part of", "led by": "Led by", "destination": "To",
  "birth of": "Birth of", "death of": "Death of", "creation of": "Creation of", "located in": "In", "place type": "Kind of place" };
const FIRST = ["name", "birth of", "death of", "creation of", "father", "mother", "spouse", "concubine", "sibling", "lifespan", "age", "meaning of name", "reason for name",
  "place", "participant", "led by", "part of", "destination", "place type", "located in", "lived at", "burial place"];
const HIDE = new Set(["date", "earliest date", "latest date", "occurred before", "designation"]);
const go = id => { const n = NM[id] || (CARDS[id] && CARDS[id].n); return n ? `<a class="go" data-go="${id}">${n}</a>` : ""; };
const yearOf = id => { const y = INV.events[id]; return !y ? null : y.y != null ? y.y : y.lo; };
const yearText = (y, mark = "") => y.y != null ? `${cal(y.y)}${mark} <span class="amy num">AM ${Math.round(y.y).toLocaleString()}</span>` : `between ${cal(y.lo)} and ${cal(y.hi)}${mark}`;
const tipText = s => (s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const how = f => f.b === "calculated" ? `<sup class="bs" title="Reckoned: ${tipText(f.w)}">†</sup>` : f.b === "inferred" ? `<sup class="bs" title="Inferred: ${tipText(f.w)}">*</sup>` : "";
const val = f => f.e ? go(f.e) : f.y != null ? `${cal(f.y)} <span class="amy num">AM ${Math.round(f.y).toLocaleString()}</span>` : (f.v || "");
const ctx = f => f.at ? ` <span class="ctx">at ${go(f.at)}</span>` : f.from || f.to ? ` <span class="ctx">${f.from ? `from ${go(f.from)}` : ""}${f.to ? ` until ${go(f.to)}` : ""}</span>` : "";
const line = f => `<div>${val(f)}${how(f)}${ctx(f)}${f.r ? `<span class="rf">${f.r}</span>` : ""}</div>`;
function invCard(id, band, o) {
  const en = CARDS[id], fs = en.f || [], rv = en.rv || {}; NM = en.nm || {}; const kind = { person: "Person", event: "Event", place: "Place", group: "People", object: "Thing", deity: "God", spirit: "Spirit" }[en.k] || en.k;
  const rows = [], byProp = {};
  fs.forEach(f => (byProp[f.p] = byProp[f.p] || []).push(f));
  const row = (label, html) => { if (html) rows.push(`<dt>${label}</dt><dd>${html}</dd>`); };
  const cell = list => list.filter(f => !f.s).map(line).join("") + list.filter(f => f.s).map(f => `<div class="alt">Also read: ${val(f)}${f.r ? `<span class="rf">${f.r}</span>` : ""}${f.w ? ` — ${f.w}` : ""}</div>`).join("");
  let when = "";
  if (en.k === "person") {
    const bd = en.bd || {}, born = bd.born || bd.made, died = bd.died, first = x => x.y != null ? x.y : x.lo;
    if (born || died) when = `${born ? cal(first(born)) : "?"} – ${died ? cal(first(died)) : "?"}`;
    const dateLine = x => `<div>${yearText(x, how(x))}${x.r ? `<span class="rf">${x.r}</span>` : ""}</div>`;
    if (born) row(bd.born ? "Born" : "Made", dateLine(born));
    if (died) row("Died", dateLine(died));
  } else if (en.k === "event" && INV.events[id]) {
    const y = INV.events[id], d = fs.find(f => (f.p === "date" || f.p === "earliest date") && !f.s) || {};
    when = y.y != null ? cal(y.y) : `${cal(y.lo)} – ${cal(y.hi)}`;
    row("When", `<div>${yearText(y, how(d))}${d.r ? `<span class="rf">${d.r}</span>` : ""}</div>`);
  }
  const order = [...FIRST.filter(p => byProp[p]), ...Object.keys(byProp).filter(p => !FIRST.includes(p) && !HIDE.has(p)).sort()];
  order.forEach(p => { if (p === "name" && byProp.name.length === 1 && byProp.name[0].v === en.n) return; row(LABEL[p] || p[0].toUpperCase() + p.slice(1), cell(byProp[p])); });
  // what the rest of the Inventory says of this entry: children, and the events it belongs to
  row("Children", (rv.kids || []).map(k => `<div>${go(k)}</div>`).join(""));
  if (en.k !== "event") row("Events", (rv.evs || []).map(e => `<div class="evl">${yearOf(e) != null ? `<span class="num yr">${cal(yearOf(e))}</span>` : `<span class="yr"></span>`}${go(e)}</div>`).join(""));
  else row("Includes", (rv.inc || []).map(e => `<div>${go(e)}</div>`).join(""));
  const onChart = o && o.kind === "Person" && o.b <= 2553 && !o.approx;
  return `<div class="body"><div class="kind">${band || kind}</div><h3>${en.n}</h3>${when ? `<div class="when num">${when}</div>` : ""}<div class="desc">${en.d}</div>
    <dl>${rows.join("")}</dl>${rows.join("").includes('class="bs"') ? `<div class="key"><b>†</b> reckoned from the years and ages Scripture gives<span>·</span><b>*</b> inferred from Scripture<span>·</span>rest the pointer on a mark to see the working</div>` : ""}${onChart ? `<div class="acts"><a class="btn2" href="#" onclick="openPanel('d0');return false">See it on From Adam to Moses</a></div>` : ""}
    <div class="fine">From the Bible Inventory, ${id}. Every line is approved against the New King James Version; the Inventory now reaches ${INV.through}.</div></div>`;
}
function openEntry(id) { const o = Object.values(ALL).find(o => o.inv === id); if (o) { openPanel(o.id); return; }
  if (waiting(id)) { afterLoad(id, () => openEntry(id)); return; } if (!CARDS[id]) return;
  hideTip(); noteCard("e:" + id); pbody.innerHTML = invCard(id); finishCard(); }
const cardHist = []; let cardNow = null, cardNav = false, cardBack = false;
function noteCard(key) {  // a card opened from a card is a step forward; one opened from the timeline starts afresh
  if (cardBack) cardBack = false;
  else if (cardNav && cardNow && cardNow !== key && panel.classList.contains("open")) cardHist.push(cardNow);
  else if (!cardNav) cardHist.length = 0;
  cardNow = key; }
const cardName = key => { const id = key.slice(2); return key[0] === "t" ? ALL[id].name : (CARDS[id] || {}).n || id; };
function finishCard() {
  const b = pbody.querySelector(".body");
  if (b && cardHist.length) b.insertAdjacentHTML("afterbegin", `<button class="back" id="pback"><i class="chev"></i>${cardName(cardHist[cardHist.length - 1])}</button>`);
  pbody.scrollTop = 0; panel.classList.add("open"); }
function cardGoBack() { const key = cardHist.pop(); if (!key) return; cardBack = true;
  if (key[0] === "t") openPanel(key.slice(2)); else { hideTip(); cardNow = key; cardBack = false; pbody.innerHTML = invCard(key.slice(2)); finishCard(); } }
pbody.addEventListener("click", e => { if (e.target.closest("#pback")) { e.stopImmediatePropagation(); cardGoBack(); return; }
  cardNav = true; setTimeout(() => cardNav = false); }, true);
pbody.addEventListener("click", e => { const a = e.target.closest("[data-go]"); if (a) { e.preventDefault(); openEntry(a.dataset.go); } });
document.getElementById("px").onclick = closePanel;
// the card's width: 460 to start, then as the reader drags it, kept for their next visit
const pgrip = document.getElementById("pgrip");
let pw = 460; try { pw = +localStorage.getItem("vb-card-width") || 460; } catch (e) {}
const setPW = w => { pw = Math.round(Math.min(Math.max(w, 380), Math.max(380, innerWidth - 120))); panel.style.setProperty("--pw", pw + "px"); };
setPW(pw); addEventListener("resize", () => setPW(pw));
pgrip.addEventListener("pointerdown", e => { e.preventDefault(); pgrip.setPointerCapture(e.pointerId); panel.classList.add("sizing"); });
pgrip.addEventListener("pointermove", e => { if (panel.classList.contains("sizing")) setPW(panel.getBoundingClientRect().right - e.clientX); });
const endSize = () => { if (!panel.classList.contains("sizing")) return; panel.classList.remove("sizing"); try { localStorage.setItem("vb-card-width", pw); } catch (e) {} };
pgrip.addEventListener("pointerup", endSize); pgrip.addEventListener("pointercancel", endSize);

new ResizeObserver(() => render()).observe(document.getElementById("stage"));
document.fonts.ready.then(() => layout());
if (new URLSearchParams(location.search).get("sep")) document.body.classList.add("sep-" + new URLSearchParams(location.search).get("sep"));
layout();
addEventListener("resize", () => layout());
setView(-1e6, -1e6 + 2000); toLever(3004);
// a link from another page opens the timeline at one thing: index.html#d3 (a map or chart), index.html#EVT-00076 (an
// entry in the Bible Inventory); the view keeps its width and centres on the thing's years, and its card opens (09/29/2026)
function openHash() { const id = decodeURIComponent(location.hash.slice(1)); if (!id) return;
  const o = ALL[id] || Object.values(ALL).find(x => x.inv === id);
  if (!o) { if (INV && /^[A-Z]{3}-\d{5}$/.test(id)) openEntry(id); return; }
  const s = o.s ?? o.b, e = o.e ?? o.d ?? s, span = v1 - v0, mid = (s + e) / 2;
  setView(mid - span / 2, mid + span / 2); openPanel(o.id); }
openHash(); addEventListener("hashchange", openHash);
requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove("still")));
document.body.dataset.lives = PEOPLE.length;  // read by Working\Inventory Link\update_site.py to know the page ran  // the page opens on 2,000 years, the lever on 1,000 BC (the user, 09/27/2026)
if (document.fonts) document.fonts.ready.then(() => render());
</script>
<script>/* the visit counter (the owner, 09/30/2026): the small number over "Sources" counts visits. Abacus
   (abacus.jasoncameron.dev), a free counting service that needs no account, keeps the number. A visit is counted when a
   reader comes in from outside the site; moving between pages, reloading or going back does not count again. Robots, the
   copies on the maker's computer and any browser once opened at view.bible/?not-counted are never counted
   (view.bible/?counted undoes it). If the service does not answer, no number shows.
   Two more counts, kept but not shown (the owner, 10/03/2026; update_site.py writes them into the Update Log): "browsers",
   each browser the first time it is counted (it remembers that in its own storage, with no cookie; a private window or
   cleared storage counts again), and "dl-<file name>", each click on a Download link (a click, not a finished download;
   a file opened straight from a search or a shared link is not seen). The same script is in pages.py (COUNT_JS). */
(function () { const A = "https://abacus.jasoncameron.dev/", N = "view.bible/";
  let me = false;
  try { const q = location.search;
    if (/[?&]not-counted\b/.test(q)) { localStorage.setItem("vb-not-counted", "1"); alert("Visits from this browser will not be counted."); }
    if (/[?&]counted\b/.test(q)) { localStorage.removeItem("vb-not-counted"); alert("Visits from this browser will be counted again."); }
    if (/counted\b/.test(q)) history.replaceState(null, "", location.pathname + location.hash);
    me = localStorage.getItem("vb-not-counted") === "1"; } catch (e) {}
  const robot = navigator.webdriver || /bot|crawl|spider|slurp|headless|lighthouse|preview|inspectiontool|googleother/i.test(navigator.userAgent);
  const live = location.host === "view.bible" && !me && !robot;
  if (live) { const tally = ev => { if (ev.type === "auxclick" && ev.button !== 1) return;
      const a = ev.target && ev.target.closest && ev.target.closest("a[download]"); if (!a) return;
      const f = (a.getAttribute("href") || "").split(/[?#]/)[0].split("/").pop().replace(/[^A-Za-z0-9_.-]/g, "");
      if (f) fetch(A + "hit/" + N + ("dl-" + f).slice(0, 64), { keepalive: true }).catch(() => {}); };
    addEventListener("click", tally); addEventListener("auxclick", tally); }
  const el = document.getElementById("hits"); if (!el) return;
  const nav = ((performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || {}).type;
  let outside = true; try { outside = !document.referrer || new URL(document.referrer).host !== location.host; } catch (e) {}
  const hit = live && outside && nav !== "reload" && nav !== "back_forward";
  if (hit) try { if (!localStorage.getItem("vb-seen")) { localStorage.setItem("vb-seen", new Date().toISOString().slice(0, 10));
    fetch(A + "hit/" + N + "browsers").catch(() => {}); } } catch (e) {}
  fetch(A + (hit ? "hit/" : "get/") + N + "visits")
    .then(r => r.ok ? r.json() : null).then(j => { if (j && j.value > 0) el.textContent = j.value.toLocaleString("en-US"); }).catch(() => {});
})();</script>
