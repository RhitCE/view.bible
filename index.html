<script>
const ARROW = '<svg viewBox="0 0 16 16"><path d="M2.5 8h11M9.5 4l4 4-4 4"/></svg>';
const themeBtn = document.getElementById("theme");
themeBtn.textContent = document.documentElement.dataset.theme === "dark" ? "Light" : "Dark";
themeBtn.onclick = () => { const m = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = m; themeBtn.textContent = m === "dark" ? "Light" : "Dark"; try { localStorage.setItem("vb-theme", m); } catch (e) {} };

// The box to find a person (decision D065's box, from the timeline): every person the Bible Inventory's cards hold, from
// names.js; the years of those on the timeline's band, from band.js; each person's card from inv\, as on the timeline.
const box = document.getElementById("find"), list = document.getElementById("list"), sc = document.getElementById("sc"), ct = document.getElementById("ct");
const wrap = document.getElementById("wrap"), pcard = document.getElementById("pcard");
let NAMES = null, PEOPLE = null, wait = null, hits = [], gold = -1;
window.VBNAMES = d => { NAMES = d; };
const CARDS = {}, LOADING = {};
window.VBI = group => Object.assign(CARDS, group);
const load = src => new Promise(res => { const s = document.createElement("script"); s.src = src; s.onload = s.onerror = () => res(); document.head.appendChild(s); });
function need() { return wait || (wait = Promise.all([load("names.js"), load("band.js"), load("inventory.js")])); }
const chunkOf = id => id.slice(0, 3).toLowerCase() + Math.floor(+id.slice(4) / ((window.INV && INV.chunk) || 200));
function needCard(id) { if (CARDS[id]) return Promise.resolve(); const k = chunkOf(id); return LOADING[k] || (LOADING[k] = load("inv/" + k + ".js")); }
// capitals and marks ignored; a hyphen counts as a space, so 'Edom' finds Obed-Edom (as on the timeline)
const fold = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[‘’'`]/g, "").replace(/[\s\-‐-―]+/g, " ").trim();
const esc = s => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function people() {
  if (PEOPLE) return PEOPLE;
  const rows = new Map(((window.BAND || {}).rows || []).map(r => [r.i, r]));
  PEOPLE = ((NAMES || {}).people || []).map(([id, n, d, vc, alts = [], same = []]) => ({ id, n, d, vc, alts, same, keys: [fold(n), ...alts.map(fold)] }));
  const byId = new Map(PEOPLE.map(p => [p.id, p]));
  // the band row a person is drawn on: their own, or that of an entry the Inventory holds to be the same person
  PEOPLE.forEach(p => { if (rows.has(p.id)) { p.row = rows.get(p.id); return; }
    const seen = new Set([p.id]), st = [...p.same];
    while (st.length) { const q = st.shift(); if (seen.has(q)) continue; seen.add(q); if (rows.has(q)) { p.row = rows.get(q); return; } st.push(...((byId.get(q) || {}).same || [])); } });
  return PEOPLE;
}
// 0 the name itself, 1 it begins the name, 2 it begins a later word of it
const fit = (k, q) => k === q ? 0 : k.startsWith(q) ? 1 : (" " + k).includes(" " + q) ? 2 : 9;
function search(raw) {
  const q = fold(raw); if (!q) return [];
  const out = [];
  people().forEach(p => { let best = 9; p.keys.forEach(k => { best = Math.min(best, fit(k, q)); }); if (best < 9) out.push({ p, t: best }); });
  return out.sort((a, b) => a.t - b.t || b.p.vc - a.p.vc || (a.p.id < b.p.id ? -1 : 1));
}
function show(faint) {
  const raw = box.value; if (!fold(raw)) { hide(); return; }
  hits = search(raw); gold = -1;
  sc.innerHTML = hits.length ? hits.map((h, i) => { const p = h.p, id = encodeURIComponent(p.id);
      // a life the band places only by its kin (k) has no years given in Scripture, so no place on the map
      const map = p.row && p.row.k !== "k" ? `<a class="go" href="bible-map/index.html#y=${p.row.a}"><span class="arr" aria-hidden="true">${ARROW}</span>On the Bible Map</a>`
        : `<span class="go off"><span class="arr" aria-hidden="true">${ARROW}</span>No years given for the map</span>`;
      return `<div class="row" role="option" id="r${i}" data-i="${i}"><div class="who"><div class="n">${esc(p.n)}${p.alts.length ? `<i>also ${esc(p.alts.join(", "))}</i>` : ""}</div>${p.d ? `<div class="d">${esc(p.d)}</div>` : ""}</div>`
        + `<a class="go first" href="bible-timeline/index.html#${id}"><span class="arr" aria-hidden="true">${ARROW}</span>On the timeline</a>${map}</div>`; }).join("")
    : `<div class="none">No one of that name in the Bible Inventory.</div>`;
  ct.textContent = hits.length === 1 ? "1 person" : `${hits.length.toLocaleString()} people`; ct.style.display = hits.length ? "" : "none";
  list.classList.add("on"); list.classList.toggle("faint", !!faint); sc.scrollTop = 0;
  box.setAttribute("aria-expanded", "true"); box.removeAttribute("aria-activedescendant");
  if (hits.length && !faint) showCard(hits[0].p.id, false); else hideCard();
}
function hide() { list.classList.remove("on", "faint"); box.setAttribute("aria-expanded", "false"); gold = -1; hideCard(); }
function goldTo(i) {
  const rows = sc.querySelectorAll(".row"); if (!rows.length) return;

  gold = Math.max(0, Math.min(rows.length - 1, i)); rows[gold].classList.add("hi"); rows[gold].scrollIntoView({ block: "nearest" });
  box.setAttribute("aria-activedescendant", "r" + gold); showCard(hits[gold].p.id, true);
}

// the card, as the timeline writes it (bible-timeline.src.html, invCard): each fact with its verses, each name a link
const cal = am => am < 4004 ? `${Math.round(4004 - am).toLocaleString()} BC` : `AD ${Math.round(am - 4003).toLocaleString()}`;
let NM = {};
const LABEL = { "name": "Names", "father": "Father", "mother": "Mother", "spouse": "Married", "concubine": "Concubine", "sibling": "Brother or sister",
  "lifespan": "Lived", "meaning of name": "Name means", "reason for name": "Why the name", "lived at": "Lived at", "burial place": "Buried",
  "occupation": "Work", "place": "Where", "participant": "Who", "part of": "Part of", "led by": "Led by", "destination": "To",
